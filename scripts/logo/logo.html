<!doctype html>
<html><head><meta charset="utf-8">
<title>国学经典共读 · 站徽源文件</title>
<style>
  /* 本地渲染用字体（不随仓库分发，见 README 的下载命令）
     商用授权：SIL OFL 1.1，可用于商标 / logo */
  @font-face{font-family:'MSZ';src:url('../../.logo-build/mashanzheng.ttf') format('truetype')}
  html,body{margin:0;padding:0;overflow:hidden;background:#eee}
</style></head>
<body>
<!-- 512×512 视口下整页截图即得 icons/icon-512.png -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#a83e2c"/>
      <stop offset="0.52" stop-color="#9a3324"/>
      <stop offset="1" stop-color="#8a2c1f"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.42" cy="0.40" r="0.92">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a1108" stop-opacity="0.26"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.98  0 0 0 0 0.93  0 0 0 0 0.85  0 0 0 0.055 0"/>
    </filter>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.35  0 0 0 0 0.07  0 0 0 0 0.03  0 0 0 0.10 0"/>
    </filter>
    <filter id="bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="4" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" filter="url(#grain2)"/>
  <rect width="512" height="512" filter="url(#grain)"/>

  <!-- 竖排「国学」：墨迹 190×400，左右留白 161，上下留白 56；墨迹中心正落在 256,256 -->
  <g filter="url(#bleed)" font-family="MSZ" fill="#6d1d12" opacity="0.5">
    <text x="256" y="222.7" font-size="190" text-anchor="middle">国</text>
    <text x="256" y="432.7" font-size="190" text-anchor="middle">学</text>
  </g>
  <g filter="url(#ink)" font-family="MSZ" fill="#f8f0de">
    <text x="256" y="222.7" font-size="190" text-anchor="middle">国</text>
    <text x="256" y="432.7" font-size="190" text-anchor="middle">学</text>
  </g>

  <rect width="512" height="512" filter="url(#grain)" opacity="0.55"/>
  <rect width="512" height="512" fill="url(#vig)"/>
</svg>
</body></html>
